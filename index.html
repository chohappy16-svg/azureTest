<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 분류기 — HTML·CSS·JavaScript 직접 실행</title>
    <!-- CSS 파일은 HTML과 같은 폴더에 있어야 합니다. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>AI 이미지 분류기</h2>
        <p class="help">서버 없이 index.html을 더블클릭하여 실행할 수 있습니다. 이미지 미리보기는 오프라인에서도 동작하지만, 최초 AI 분석에는 인터넷이 필요합니다.</p>
        <div class="row">
            <section class="column" aria-label="이미지 선택">
                <!-- label과 fileInput을 연결하여 클릭 시 파일 선택창을 엽니다. -->
                <label class="upload-box" for="fileInput" id="uploadBox">
                    <span id="uploadText" class="upload-text">이미지 선택 (클릭 또는 드래그)</span>
                    <img id="preview" alt="선택한 이미지 미리보기">
                </label>
                <!-- 이미지는 서버에 전송하지 않고 브라우저에서만 처리합니다. -->
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" class="visually-hidden">
                <p id="fileInfo" class="help">JPG / PNG / WEBP / GIF · 최대 10MB</p>
                <p id="status" class="status" role="status" aria-live="polite">이미지를 선택해 주세요.</p>
                <button id="analyzeBtn" class="btn-primary" type="button" disabled>이미지를 먼저 선택해 주세요</button>
                <button id="retryBtn" class="btn-secondary" type="button" hidden>AI 모델 다시 불러오기</button>
            </section>
            <section class="column" aria-label="이미지 분석 결과">
                <div class="output-box">
                    <div class="output-title">AI 분석 결과 · 상위 5개</div>
                    <div id="bars">이미지 선택 후 분석 버튼을 눌러주세요.</div>
                    <div id="description" class="desc-box"></div>
                </div>
            </section>
        </div>
    </main>
    <!-- 중요: type="module"을 사용하지 않습니다. file://에서도 일반 스크립트를 바로 실행합니다. -->
    <!-- 외부 AI 라이브러리는 app.js 내부에서 필요할 때만 동적으로 내려받습니다. -->
    <script src="app.js" defer></script>
</body>
</html>
